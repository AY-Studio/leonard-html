<section class="container-xxl pt-section">
        <div class="leonard-newsletter position-relative px-4 px-lg-8 py-7">
          <div
            class="leonard-corners text-primary fs-1 fw-thin"
            aria-hidden="true"
          >
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="row align-items-center gy-5 position-relative">
            <div class="col-12 col-lg-6">
              <p
                class="leonard-eyebrow fw-light fs-8 ls-label text-uppercase mb-4"
              >
                Sign up for updates
              </p>
              <h2 data-scramble class="display-h3 lh-flat text-primary text-uppercase mb-4">
                Get the news<br />from the front line
              </h2>
              <div class="leonard-rte fw-normal">
                <p>
                  Project stories, technical insights, and industry news. No
                  noise, just substance.
                </p>
              </div>
            </div>
            <div class="col-12 col-lg-5 offset-lg-1">
              <form class="d-flex flex-column flex-sm-row gap-3" novalidate>
                <label class="visually-hidden" for="newsletterEmail"
                  >Email address</label
                >
                <input
                  class="form-control leonard-newsletter__input"
                  type="email"
                  id="newsletterEmail"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                />
                <button
                  class="btn btn-primary btn-lg flex-shrink-0 fw-light text-nowrap text-uppercase"
                  type="submit"
                >
                  Sign up
                </button>
              </form>
              <p class="fw-normal fs-11 lh-body mt-3 mb-0">
                By clicking Sign Up you're confirming that you agree with our
                Terms and Conditions.
              </p>
            </div>
          </div>
        </div>
      </section>
