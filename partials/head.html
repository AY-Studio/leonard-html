<!-- Shared <head>. Every page is: charset, its own <title>, then this include.
     Keep page-specific tags (title, description) in the page; everything that is
     the same sitewide belongs here, so a change lands once instead of 30+ times.

     Order matters in two places:
     - <meta charset> stays in the page, first, so it is inside the first 1024
       bytes of the document.
     - The critical <style> + transition <script> below must run before first
       paint, and before Vite's stylesheet <link> (which it appends to the end
       of <head>) — so they stay at the top of this partial. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  /* Critical: the arriving transition panel covers before any CSS loads,
     so it also masks the dev server JS-injected-CSS flash. The ::after is the
     LEONARD wordmark watermark — it has to be here too, or an arriving page
     paints a bare yellow screen for a frame before the stylesheet lands.
     Keep in step with .leonard-pt in scss/_custom.scss. */
  .leonard-pt-arriving .leonard-pt { position: fixed; inset: 0; z-index: 3000; background: #ffdd00; }
  .leonard-pt-arriving .leonard-pt::after { content: ""; position: absolute; top: 50%; left: 50%; width: clamp(220px, 58vw, 940px); aspect-ratio: 1180.98 / 180.02; transform: translate(-50%, -50%); background: url(/img/intro-wordmark.svg) no-repeat center / 100% 100%; opacity: .2; }
</style>
<script>
  // Page transition: if we arrived via an in-site link, cover before first
  // paint so the new page does not flash before the reveal (main.js).
  try {
    if (sessionStorage.getItem("leonard-pt") === "1") {
      document.documentElement.classList.add("leonard-pt-arriving");
    }
  } catch (e) {}
</script>
<link rel="preload" href="/fonts/gilroy-heavy.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preconnect" href="https://use.typekit.net" crossorigin />
<link rel="stylesheet" href="https://use.typekit.net/djc8uke.css" />
<script src="https://kit.fontawesome.com/462bc6ee41.js" crossorigin="anonymous"></script>
